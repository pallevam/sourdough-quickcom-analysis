name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install --no-deps -e .
          python -m pip install 'pytest>=8,<9'
      - name: Build warehouse from bundled datasets
        run: python -m qcom build
      - name: Run query, ingestion fixture and dashboard tests
        run: python -m pytest -q
